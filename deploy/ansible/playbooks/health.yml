---
# Comadre Health Diagnostic Playbook
# Read-only diagnostic tool for troubleshooting Comadre deployments:
#   ansible-playbook playbooks/health.yml -i inventory/production.yml
#
# This playbook NEVER modifies anything. It checks container state, queries
# the health endpoint, inspects disk usage and cron jobs, and reports warnings.
# Entirely unprivileged — no become: true.

- name: Diagnose Comadre TTS Service
  hosts: comadre_vps
  gather_facts: false

  tasks:
    # =========================================================================
    # Prerequisites
    # =========================================================================

    - name: "[Prereq] Check Comadre directory exists"
      ansible.builtin.stat:
        path: "~/comadre"
      register: comadre_dir

    - name: "[Prereq] Verify Comadre is deployed"
      ansible.builtin.assert:
        that:
          - comadre_dir.stat.exists
          - comadre_dir.stat.isdir
        fail_msg: >-
          ~/comadre directory does not exist.
          Run bootstrap.yml first to deploy the service.
        success_msg: "Comadre directory found."

    # =========================================================================
    # Container State
    # =========================================================================

    - name: "[Docker] Check TTS service state"
      ansible.builtin.command:
        cmd: docker compose -f ~/comadre/compose.yaml ps -q --status running tts-service
      register: tts_running_containers
      changed_when: false

    - name: "[Docker] Check Caddy container state"
      community.docker.docker_container_info:
        name: caddy
      register: caddy_container

    - name: "[Docker] Report TTS service not running"
      when: tts_running_containers.stdout_lines | length == 0
      ansible.builtin.debug:
        msg: >-
          WARNING: TTS service has no running containers.
          Check logs with: cd ~/comadre && docker compose logs tts-service
          Restart with: cd ~/comadre && docker compose up -d

    - name: "[Docker] Report Caddy container not running"
      when: not (caddy_container.exists and (caddy_container.container.State.Running | default(false)))
      ansible.builtin.debug:
        msg: >-
          WARNING: Caddy reverse proxy is not running. HTTPS is down.
          Check logs with: cd ~/comadre && docker compose logs caddy
          Restart with: cd ~/comadre && docker compose up -d

    # =========================================================================
    # Health Endpoint
    # =========================================================================

    - name: "[Health] Query health endpoint"
      when: tts_running_containers.stdout_lines | length > 0
      ansible.builtin.uri:
        url: "https://{{ domain | default('localhost') }}/health"
        validate_certs: false
        return_content: true
        status_code: [200, 503]
      register: health_check
      ignore_errors: true

    - name: "[Health] Explain Qwen3 voice is missing"
      when:
        - health_check is defined
        - health_check.json is defined
        - not (health_check.json.voices | default([]) | select('match', '^qwen/') | list | length)
      ansible.builtin.debug:
        msg: >-
          INFO: No qwen/* voices are reported.
          Either QWEN3_ENABLED is false for this host, or the qwen3-tts-cli
          binary / model / tokenizer are not deployed correctly.
          See docs for troubleshooting.

    # =========================================================================
    # Disk Usage
    # =========================================================================

    - name: "[Disk] Check root filesystem usage"
      ansible.builtin.command:
        cmd: df -h /
      register: disk_usage
      changed_when: false

    - name: "[Disk] Check audio volume size"
      when: tts_running_containers.stdout_lines | length > 0
      ansible.builtin.command:
        cmd: docker compose -f ~/comadre/compose.yaml exec -T tts-service du -sh /audio
      register: audio_volume_size
      changed_when: false
      ignore_errors: true

    - name: "[Disk] Warn on high disk usage"
      when:
        - disk_usage.stdout is defined
        - >-
          (disk_usage.stdout_lines[1] | default('')
          | regex_search('([0-9]+)%', '\\1')
          | default(['0']) | first | int) > 80
      ansible.builtin.debug:
        msg: >-
          WARNING: Root filesystem usage is
          {{ disk_usage.stdout | regex_search('([0-9]+%)', '\\1') | default(['unknown']) | first }}
          (threshold: 80%).
          Verify audio cleanup cron is active: crontab -l | grep comadre-audio-cleanup
          Expected: every 6h, deleting audio files older than 24h.

    # =========================================================================
    # Cron Jobs
    # =========================================================================

    - name: "[Cron] Check crontab entries"
      ansible.builtin.command:
        cmd: crontab -l
      register: crontab_check
      changed_when: false
      ignore_errors: true

    # =========================================================================
    # Summary
    # =========================================================================

    - name: "[Summary] Full diagnostic report"
      vars:
        container_running: "{{ tts_running_containers.stdout_lines | length > 0 }}"
        caddy_running: "{{ caddy_container.exists and (caddy_container.container.State.Running | default(false)) }}"
        hc: "{{ health_check.json | default({}) }}"
        has_health: >-
          {{ health_check is defined
          and health_check.json is defined
          and health_check is not failed }}
        kokoro_voice_count: >-
          {{ hc.voices | default([]) | select('match', '^kokoro/') | list | length }}
        qwen_voice_count: >-
          {{ hc.voices | default([]) | select('match', '^qwen/') | list | length }}
        daily_restart_cron: >-
          {{ 'Active'
          if (crontab_check.stdout | default(''))
          is search('comadre-daily-restart')
          else 'NOT FOUND' }}
        audio_cleanup_cron: >-
          {{ 'Active'
          if (crontab_check.stdout | default(''))
          is search('comadre-audio-cleanup')
          else 'NOT FOUND' }}
      ansible.builtin.debug:
        msg: |
          ============================================
          Comadre TTS Service — Health Diagnostic
          ============================================

          TTS Container:   {{ 'Running' if (container_running | bool) else 'NOT RUNNING' }}
          Caddy Proxy:     {{ 'Running' if (caddy_running | bool) else 'NOT RUNNING' }}
          {% if has_health | bool %}
          Service Status:  {{ hc.status | default('unknown') }}
          Loaded Voices:   {{ hc.voices | default([]) | join(', ') }}
          Voice Count:     {{ hc.voices | default([]) | length }}
            kokoro/*:      {{ kokoro_voice_count }}
            qwen/*:        {{ qwen_voice_count }}
          {% else %}
          Service Status:  Unable to query health endpoint
          {% if not container_running | bool %}
          Suggestion:      Check docker compose logs and restart the container
          {% endif %}
          {% endif %}

          Disk Usage:      {{ disk_usage.stdout_lines[1] | default('Unable to check') }}
          Audio Volume:    {{ audio_volume_size.stdout | default('Unable to check (container not running)') }}

          Cron Jobs:
            Daily Restart:   {{ daily_restart_cron }}
            Audio Cleanup:   {{ audio_cleanup_cron }}

          ============================================
