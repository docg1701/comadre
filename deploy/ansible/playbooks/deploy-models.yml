---
# Comadre Model Deployment Playbook (v3 — pocket-tts, air-gapped path)
# Pre-deploys the pinned pocket-tts artifacts into the comadre-models Docker
# volume so the first container boot does NOT need HF_TOKEN / network access:
#   ansible-playbook playbooks/deploy-models.yml -i inventory/production.yml
#
# Requires pocket_model_local, pocket_tokenizer_local and pocket_rafael_local
# inventory variables pointing to the locally downloaded files (model ~370 MB
# gated, tokenizer ~1 MB, rafael embedding ~1 MB). When they are empty (the
# default), the playbook fails its prerequisite check BY DESIGN — models
# auto-download on first startup via HF_TOKEN. See docs/deployment-guide.md.
#
# Can be run independently of bootstrap/update: initial deploy, re-deploy
# after volume loss, or deploy updated model revisions.
# Entirely unprivileged — no become: true.

- name: Deploy pocket-tts Models
  hosts: comadre_vps
  gather_facts: true

  tasks:
    # =========================================================================
    # Prerequisites
    # =========================================================================

    - name: "[Prereq] Check Comadre directory exists"
      ansible.builtin.stat:
        path: "~/comadre"
      register: comadre_dir

    - name: "[Prereq] Verify Comadre is deployed"
      ansible.builtin.assert:
        that:
          - comadre_dir.stat.exists
          - comadre_dir.stat.isdir
        fail_msg: >-
          ~/comadre directory does not exist.
          Run bootstrap.yml first to deploy the service.
        success_msg: "Comadre directory found."

    - name: "[Prereq] Validate pocket model path is set"
      ansible.builtin.assert:
        that:
          - pocket_model_local | default('') | length > 0
        fail_msg: >-
          pocket_model_local is not configured.
          Set it in inventory/production.yml to the local path of the
          pocket-tts model.safetensors (languages/<lang>/model.safetensors from
          the gated kyutai/pocket-tts repo). Leave the vars empty and run
          bootstrap.yml with HF_TOKEN to auto-download instead.
        success_msg: "Model path: {{ pocket_model_local }}"

    - name: "[Prereq] Validate tokenizer path is set"
      ansible.builtin.assert:
        that:
          - pocket_tokenizer_local | default('') | length > 0
        fail_msg: >-
          pocket_tokenizer_local is not configured.
          Set it in inventory/production.yml to the local path of the
          pocket-tts tokenizer.model (public kyutai/pocket-tts-without-
          voice-cloning repo).
        success_msg: "Tokenizer path: {{ pocket_tokenizer_local }}"

    - name: "[Prereq] Validate rafael embedding path is set"
      ansible.builtin.assert:
        that:
          - pocket_rafael_local | default('') | length > 0
        fail_msg: >-
          pocket_rafael_local is not configured.
          Set it in inventory/production.yml to the local path of the
          rafael.safetensors embedding (languages/<lang>/embeddings/rafael.
          safetensors from the public repo).
        success_msg: "Rafael path: {{ pocket_rafael_local }}"

    # =========================================================================
    # Stage Model Files on VPS
    # =========================================================================

    - name: "[Models] Create staging directory"
      ansible.builtin.file:
        path: "~/comadre/deploy/staging/pocket-tts"
        state: directory
        mode: "0755"

    - name: "[Models] Stage model on VPS"
      ansible.builtin.copy:
        src: "{{ pocket_model_local }}"
        dest: "~/comadre/deploy/staging/pocket-tts/model.safetensors"
        mode: "0644"

    - name: "[Models] Stage tokenizer on VPS"
      ansible.builtin.copy:
        src: "{{ pocket_tokenizer_local }}"
        dest: "~/comadre/deploy/staging/pocket-tts/tokenizer.model"
        mode: "0644"

    - name: "[Models] Stage rafael embedding on VPS"
      ansible.builtin.copy:
        src: "{{ pocket_rafael_local }}"
        dest: "~/comadre/deploy/staging/pocket-tts/rafael.safetensors"
        mode: "0644"

    # =========================================================================
    # Deploy into Docker Volume
    # =========================================================================

    - name: "[Models] Deploy artifacts into volume"
      block:
        - name: "[Models] Create helper container for volume access"
          community.docker.docker_container:
            name: comadre-volume-helper
            image: alpine:3.21
            command: "sh -c 'mkdir -p /models/pocket-tts/{{ pocket_language | default(\"portuguese\") }}/embeddings'"
            volumes:
              - "comadre-models:/models"
            state: started
            auto_remove: false

        - name: "[Models] Wait for helper container"
          community.docker.docker_container_info:
            name: comadre-volume-helper
          register: helper_info
          until: >-
            not (helper_info.container.State.Running | default(false))
          retries: 10
          delay: 1

        # B26 — `mode_parse: modern` is required so the "0644" string is
        # parsed as octal (0o644 = 0644). The legacy default parses it as
        # decimal 644, which lands as 0o1204 on disk (sticky + --w----r--),
        # making files non-writable by appuser. See the v2-era comment —
        # this trap is preserved verbatim.
        - name: "[Models] Copy model into models volume"
          community.docker.docker_container_copy_into:
            container: comadre-volume-helper
            path: "{{ ansible_facts['env']['HOME'] }}/comadre/deploy/staging/pocket-tts/model.safetensors"
            container_path: "/models/pocket-tts/{{ pocket_language | default('portuguese') }}/model.safetensors"
            owner_id: 0
            group_id: 0
            mode: "0644"
            mode_parse: modern

        - name: "[Models] Copy tokenizer into models volume"
          community.docker.docker_container_copy_into:
            container: comadre-volume-helper
            path: "{{ ansible_facts['env']['HOME'] }}/comadre/deploy/staging/pocket-tts/tokenizer.model"
            container_path: "/models/pocket-tts/{{ pocket_language | default('portuguese') }}/tokenizer.model"
            owner_id: 0
            group_id: 0
            mode: "0644"
            mode_parse: modern

        - name: "[Models] Copy rafael embedding into models volume"
          community.docker.docker_container_copy_into:
            container: comadre-volume-helper
            path: "{{ ansible_facts['env']['HOME'] }}/comadre/deploy/staging/pocket-tts/rafael.safetensors"
            container_path: >-
              /models/pocket-tts/{{ pocket_language | default('portuguese') }}/embeddings/rafael.safetensors
            owner_id: 0
            group_id: 0
            mode: "0644"
            mode_parse: modern

      always:
        - name: "[Models] Remove helper container"
          community.docker.docker_container:
            name: comadre-volume-helper
            state: absent

        - name: "[Models] Clean up staging directory"
          ansible.builtin.file:
            path: "~/comadre/deploy/staging"
            state: absent

    # =========================================================================
    # Summary
    # =========================================================================

    - name: "[Summary] Report model deployment status"
      ansible.builtin.debug:
        msg: |
          ============================================
          Comadre — pocket-tts Model Deployment Complete
          ============================================

          Artifacts deployed to comadre-models volume:

            ✓ model.safetensors     (~370 MB, gated weights)
            ✓ tokenizer.model       (~1 MB)
            ✓ rafael.safetensors    (~1 MB, default catalog voice)

          Volume paths (matching compose.yaml):
            /models/pocket-tts/{{ pocket_language | default('portuguese') }}/model.safetensors
            /models/pocket-tts/{{ pocket_language | default('portuguese') }}/tokenizer.model
            /models/pocket-tts/{{ pocket_language | default('portuguese') }}/embeddings/rafael.safetensors

          download.py will detect pre-deployed artifacts and skip the
          HF download on next container start.

          To apply: cd ~/comadre && docker compose restart

          ============================================
