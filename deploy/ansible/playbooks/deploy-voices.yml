---
# Comadre Voice Deployment Playbook (v3 — pocket/ voices)
# Deploys voice files (reference .wav + optional precomputed .safetensors/.json)
# into the comadre-voices Docker volume:
#   ansible-playbook playbooks/deploy-voices.yml -i inventory/production.yml
#
# Requires voices_local_dir inventory variable pointing to a local directory
# with a pocket/ subdirectory containing the voice files.
# See docs/voice-management.md for directory structure.
#
# v3 note: former v2 voice references (.wav) are reused VERBATIM as
# pocket/*.wav — pocket-tts states materialize lazily on first request.
#
# Can be run independently: initial deploy, add new voices, or replace
# existing ones. No service restart needed — voices are discovered per-request.
# Entirely unprivileged — no become: true.
#
# NOTE: This playbook reads voice files from the control node's filesystem
# (``voices_local_dir`` with ``delegate_to: localhost``). This is the
# design intent — voice files (.wav/.safetensors/.json) are operator-owned
# binary assets not tracked in Git, not deployment infrastructure scripts.
# If the control node is lost, voice files must be recovered from the
# operator's backups. For a fully machine-independent workflow, store voice
# files in object storage (S3) and add a download task before the staging step.

- name: Deploy Voice Files
  hosts: comadre_vps
  gather_facts: true

  tasks:
    # =========================================================================
    # Prerequisites
    # =========================================================================

    - name: "[Prereq] Check Comadre directory exists"
      ansible.builtin.stat:
        path: "~/comadre"
      register: comadre_dir

    - name: "[Prereq] Verify Comadre is deployed"
      ansible.builtin.assert:
        that:
          - comadre_dir.stat.exists
          - comadre_dir.stat.isdir
        fail_msg: >-
          ~/comadre directory does not exist.
          Run bootstrap.yml first to deploy the service.
        success_msg: "Comadre directory found."

    - name: "[Prereq] Validate voices directory is set"
      ansible.builtin.assert:
        that:
          - voices_local_dir | default('') | length > 0
        fail_msg: >-
          voices_local_dir is not configured.
          Set it in inventory/production.yml to the local path of your
          voices directory (containing a pocket/ subdir).
          See docs/voice-management.md for details.
        success_msg: "Voices directory: {{ voices_local_dir }}"

    # =========================================================================
    # Discover Voice Files
    # =========================================================================

    - name: "[Voices] Find pocket .wav files"
      ansible.builtin.find:
        paths: "{{ voices_local_dir }}/pocket"
        patterns: "*.wav"
      register: wav_files
      delegate_to: localhost

    - name: "[Voices] Find precomputed state/meta files"
      ansible.builtin.find:
        paths: "{{ voices_local_dir }}/pocket"
        patterns: "*.safetensors,*.json"
        use_regex: true
      register: extra_files
      delegate_to: localhost

    - name: "[Voices] Report discovered files"
      ansible.builtin.debug:
        msg: >-
          Found {{ wav_files.files | length }} pocket .wav file(s)
          and {{ extra_files.files | length }} precomputed state/meta file(s)

    # =========================================================================
    # Stage Files on VPS
    # =========================================================================

    - name: "[Voices] Create staging directory"
      ansible.builtin.file:
        path: "~/comadre/deploy/staging/pocket"
        state: directory
        mode: "0755"

    - name: "[Voices] Stage .wav files"
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "~/comadre/deploy/staging/pocket/{{ item.path | basename }}"
        mode: "0644"
      loop: "{{ wav_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: "[Voices] Stage precomputed state/meta files"
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "~/comadre/deploy/staging/pocket/{{ item.path | basename }}"
        mode: "0644"
      loop: "{{ extra_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    # =========================================================================
    # Deploy into Docker Volume
    # =========================================================================

    - name: "[Voices] Deploy files into volume"
      block:
        - name: "[Voices] Create helper container for volume access"
          community.docker.docker_container:
            name: comadre-volume-helper
            image: alpine:3.21
            command: "sh -c 'mkdir -p /voices/pocket && sleep 3600'"
            volumes:
              - "comadre-voices:/voices"
            state: started
            auto_remove: false

        # B26 — `mode_parse: modern` is required so the "0644" string is
        # parsed as octal (0o644 = 0644). The legacy default parses it as
        # decimal 644, which lands as 0o1204 on disk (sticky + --w----r--),
        # making files non-writable by appuser. See the v2-era comment —
        # this trap is preserved verbatim.
        - name: "[Voices] Copy .wav files into volume"
          community.docker.docker_container_copy_into:
            container: comadre-volume-helper
            path: "{{ ansible_facts['env']['HOME'] }}/comadre/deploy/staging/pocket/{{ item.path | basename }}"
            container_path: "/voices/pocket/{{ item.path | basename }}"
            owner_id: 0
            group_id: 0
            mode: "0644"
            mode_parse: modern
          loop: "{{ wav_files.files }}"
          loop_control:
            label: "{{ item.path | basename }}"

        - name: "[Voices] Copy precomputed state/meta files into volume"
          community.docker.docker_container_copy_into:
            container: comadre-volume-helper
            path: "{{ ansible_facts['env']['HOME'] }}/comadre/deploy/staging/pocket/{{ item.path | basename }}"
            container_path: "/voices/pocket/{{ item.path | basename }}"
            owner_id: 0
            group_id: 0
            mode: "0644"
            mode_parse: modern
          loop: "{{ extra_files.files }}"
          loop_control:
            label: "{{ item.path | basename }}"

      always:
        - name: "[Voices] Remove helper container"
          community.docker.docker_container:
            name: comadre-volume-helper
            state: absent

        - name: "[Voices] Clean up staging directory"
          ansible.builtin.file:
            path: "~/comadre/deploy/staging"
            state: absent

    # =========================================================================
    # Summary
    # =========================================================================

    - name: "[Summary] Report voice deployment status"
      ansible.builtin.debug:
        msg: |
          ============================================
          Comadre — Voice Deployment Complete
          ============================================

          pocket voices deployed: {{ wav_files.files | length }}
          {% for f in wav_files.files %}
            - pocket/{{ f.path | basename | regex_replace('\.wav$', '') }}
          {% endfor %}

          Voice states materialize lazily on first request; precomputed
          .safetensors/.json files are used when their model_hash matches.

          No restart needed — voices are available immediately.
          Verify with:
            curl -sk https://{{ domain | default('localhost') }}/health | jq '.voices'

          ============================================
