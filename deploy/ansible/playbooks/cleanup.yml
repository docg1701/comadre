---
# Comadre Cleanup Playbook — Full Decommission
# Removes ALL Comadre artifacts AND system-level components installed by
# bootstrap (Docker, UFW, apt repos, GPG keys). Returns the VPS to its
# pre-bootstrap state.
#
#   ansible-playbook playbooks/cleanup.yml -i inventory/production.yml \
#     -e "ansible_become_password=YOUR_SUDO_PASS"
#
# WARNING: This is destructive and irreversible. It removes containers,
# images, volumes, cron jobs, ~/comadre, Docker Engine, UFW, and all
# related system configuration.

- name: Full Decommission — Comadre TTS Service
  hosts: comadre_vps
  gather_facts: true

  tasks:
    # =========================================================================
    # Prerequisites
    # =========================================================================

    - name: "[Prereq] Check Comadre directory exists"
      ansible.builtin.stat:
        path: "~/comadre"
      register: comadre_dir

    # =========================================================================
    # Stop and Remove Containers + Volumes (requires ~/comadre + Docker)
    # =========================================================================

    - name: "[TTS] Stop and remove containers, volumes, and images"
      when: comadre_dir.stat.exists and comadre_dir.stat.isdir
      community.docker.docker_compose_v2:
        project_src: "~/comadre"
        state: absent
        remove_volumes: true
        remove_images: all
        remove_orphans: true
      failed_when: false

    # =========================================================================
    # Prune Docker Artifacts
    # =========================================================================

    - name: "[Docker] Prune all unused images, networks, and build cache"
      ansible.builtin.command:
        cmd: docker system prune -a -f
      changed_when: true
      failed_when: false

    # =========================================================================
    # Remove Cron Jobs
    # =========================================================================

    - name: "[Cron] Remove daily restart cron"
      ansible.builtin.cron:
        name: "comadre-daily-restart"
        state: absent

    - name: "[Cron] Remove audio cleanup cron"
      ansible.builtin.cron:
        name: "comadre-audio-cleanup"
        state: absent

    - name: "[Cron] Remove daily suspension sweep"
      ansible.builtin.cron:
        name: "comadre-daily-suspension"
        state: absent

    - name: "[Cron] Remove nightly key-registry backup"
      ansible.builtin.cron:
        name: "comadre-keys-backup"
        state: absent

    # Marker files (registry.db.cron-installed, registry.db.backup-cron-installed)
    # live inside the comadre-registry named volume, which the
    # docker_compose_v2 task above destroyed via remove_volumes: true. The
    # ~/comadre tree removal task below scrubs anything else.

    - name: "[Cron] Remove CRON_TZ envvar"
      ansible.builtin.cron:
        name: "CRON_TZ"
        env: true
        state: absent

    # =========================================================================
    # Remove Project Directory
    # =========================================================================

    - name: "[Cleanup] Remove Comadre directory"
      ansible.builtin.file:
        path: "~/comadre"
        state: absent

    # =========================================================================
    # Remove Docker Engine
    # =========================================================================

    - name: "[Docker] Stop Docker service"
      become: true
      ansible.builtin.systemd:
        name: docker
        state: stopped
        enabled: false
      failed_when: false

    - name: "[Docker] Stop containerd service"
      become: true
      ansible.builtin.systemd:
        name: containerd
        state: stopped
        enabled: false
      failed_when: false

    - name: "[Docker] Remove Docker packages"
      become: true
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: absent
        purge: true
      failed_when: false

    - name: "[Docker] Remove Docker data directory"
      become: true
      ansible.builtin.file:
        path: /var/lib/docker
        state: absent

    - name: "[Docker] Remove containerd data directory"
      become: true
      ansible.builtin.file:
        path: /var/lib/containerd
        state: absent

    # =========================================================================
    # Remove Docker APT Repository + GPG Key
    # =========================================================================

    - name: "[Docker] Remove Docker apt repository"
      become: true
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
          {{ ansible_facts['distribution_release'] }} stable
        state: absent
        filename: docker

    - name: "[Docker] Remove Docker GPG key"
      become: true
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.asc
        state: absent

    # =========================================================================
    # Remove Docker Group
    # =========================================================================

    - name: "[Docker] Remove docker group"
      become: true
      ansible.builtin.group:
        name: docker
        state: absent

    # =========================================================================
    # Remove UFW Firewall
    # =========================================================================

    - name: "[UFW] Disable firewall"
      become: true
      community.general.ufw:
        state: disabled
      failed_when: false

    - name: "[UFW] Reset UFW rules"
      become: true
      community.general.ufw:
        state: reset
      failed_when: false

    - name: "[UFW] Remove ufw package"
      become: true
      ansible.builtin.apt:
        name: ufw
        state: absent
        purge: true
      failed_when: false

    # =========================================================================
    # Clean Up Orphaned Dependencies
    # =========================================================================

    - name: "[Cleanup] Remove orphaned packages from Docker and UFW"
      become: true
      ansible.builtin.apt:
        autoremove: true
        purge: true
      failed_when: false

    # =========================================================================
    # Remove Deploy Key from GitHub
    # =========================================================================

    - name: "[Git] Check if deploy key exists (cleanup)"
      ansible.builtin.stat:
        path: "{{ deploy_key_path }}.pub"
      register: cleanup_deploy_key_stat
      become: false

    - name: "[Git] Read deploy public key for GitHub lookup"
      ansible.builtin.slurp:
        src: "{{ deploy_key_path }}.pub"
      register: cleanup_pubkey_content
      become: false
      when: cleanup_deploy_key_stat.stat.exists

    - name: "[Git] List deploy keys on GitHub"
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ github_repo_path }}/keys"
        method: GET
        headers:
          Authorization: "Bearer {{ github_pat }}"
          Accept: "application/vnd.github+json"
        status_code: [200]
      register: github_keys_list
      no_log: true
      become: false
      failed_when: false
      changed_when: false

    - name: "[Git] Delete matching deploy keys from GitHub"
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ github_repo_path }}/keys/{{ item.id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ github_pat }}"
          Accept: "application/vnd.github+json"
        status_code: [204, 404]
      loop: "{{ github_keys_list.json | default([]) if github_keys_list.status | default(-1) == 200 else [] }}"
      no_log: true
      become: false
      failed_when: false
      when:
        - github_keys_list.status | default(-1) == 200
        - >-
          item.title == 'comadre-vps-' + ansible_host
          or (
            cleanup_deploy_key_stat.stat.exists
            and item.title == 'comadre-vps'
            and item.key | trim == (cleanup_pubkey_content.content | b64decode | trim)
          )
      loop_control:
        label: "{{ item.title }} (id={{ item.id }})"

    - name: "[Git] Warn if GitHub PAT expired during key cleanup"
      ansible.builtin.debug:
        msg: >-
          GitHub API returned {{ github_keys_list.status | default('N/A') }}.
          The PAT may be expired. Deploy key must be removed manually from
          https://github.com/{{ github_repo_path }}/settings/keys
      when:
        - github_keys_list.status | default(-1) != 200
        - cleanup_deploy_key_stat.stat.exists
      become: false

    # =========================================================================
    # Remove Deploy Key
    # =========================================================================

    - name: "[Git] Remove deploy key from VPS"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ deploy_key_path }}"
        - "{{ deploy_key_path }}.pub"

    # =========================================================================
    # Summary
    # =========================================================================

    - name: "[Summary] Confirm full decommission"
      ansible.builtin.debug:
        msg: |
          ============================================
          Comadre TTS Service — Full Decommission Complete
          ============================================

          Application artifacts removed:

            ✓ Containers stopped and removed (tts-service replicas, caddy)
            ✓ Docker volumes removed (models, voices, audio, caddy-data, caddy-config)
            ✓ Docker images and build cache pruned
            ✓ Cron jobs removed (daily-restart, audio-cleanup, daily-suspension, keys-backup, CRON_TZ)
            ✓ ~/comadre directory removed

          System-level components uninstalled:

            ✓ Docker Engine removed (docker-ce, containerd, compose plugin)
            ✓ Docker data directories removed (/var/lib/docker, /var/lib/containerd)
            ✓ Docker apt repository and GPG key removed
            ✓ Docker group removed
            ✓ UFW firewall disabled and removed
            ✓ Deploy key files removed
            ✓ Deploy key removed from GitHub

          Kept (common system utilities): ca-certificates, curl, gnupg

          The VPS is restored to its pre-bootstrap state.

          To redeploy, run:
            ansible-playbook playbooks/bootstrap.yml -i inventory/production.yml

          ============================================
