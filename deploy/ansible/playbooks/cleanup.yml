---
# Comadre Cleanup Playbook
# Fully decommissions Comadre from a VPS — removes all artifacts:
#   ansible-playbook playbooks/cleanup.yml -i inventory/production.yml
#
# WARNING: This is destructive. It removes containers, images, volumes,
# cron jobs, fail2ban configs, and the ~/comadre directory. Data cannot be recovered.
# Requires become password for fail2ban cleanup.

- name: Cleanup Comadre TTS Service
  hosts: comadre_vps
  gather_facts: false

  tasks:
    # =========================================================================
    # Prerequisites
    # =========================================================================

    - name: "[Prereq] Check Comadre directory exists"
      ansible.builtin.stat:
        path: "~/comadre"
      register: comadre_dir

    - name: "[Prereq] Skip cleanup if not deployed"
      when: not (comadre_dir.stat.exists and comadre_dir.stat.isdir)
      ansible.builtin.debug:
        msg: >-
          ~/comadre directory does not exist. Nothing to clean up.
          If Comadre was previously deployed, it may have already been removed.

    - name: "[Prereq] Confirm deployment exists"
      when: not (comadre_dir.stat.exists and comadre_dir.stat.isdir)
      ansible.builtin.meta:
        end_play

    # =========================================================================
    # Stop and Remove Containers + Volumes
    # =========================================================================

    - name: "[TTS] Stop and remove containers, volumes, and images"
      community.docker.docker_compose_v2:
        project_src: "~/comadre"
        state: absent
        remove_volumes: true
        remove_images: all
        remove_orphans: true

    # =========================================================================
    # Remove Cron Jobs
    # =========================================================================

    - name: "[Fail2ban] Remove jail config"
      become: true
      ansible.builtin.file:
        path: /etc/fail2ban/jail.local
        state: absent

    - name: "[Fail2ban] Remove filter config"
      become: true
      ansible.builtin.file:
        path: /etc/fail2ban/filter.d/caddy-auth.conf
        state: absent

    - name: "[Fail2ban] Restart to drop caddy-auth jail"
      become: true
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted
      ignore_errors: true

    - name: "[Cron] Remove daily restart cron"
      ansible.builtin.cron:
        name: "comadre-daily-restart"
        state: absent

    - name: "[Cron] Remove audio cleanup cron"
      ansible.builtin.cron:
        name: "comadre-audio-cleanup"
        state: absent

    # =========================================================================
    # Remove Project Directory
    # =========================================================================

    - name: "[Cleanup] Remove Comadre directory"
      ansible.builtin.file:
        path: "~/comadre"
        state: absent

    # =========================================================================
    # Summary
    # =========================================================================

    - name: "[Summary] Confirm complete removal"
      ansible.builtin.debug:
        msg: |
          ============================================
          Comadre TTS Service — Cleanup Complete
          ============================================

          All Comadre artifacts have been removed:

            ✓ Containers stopped and removed (tts-service, caddy)
            ✓ Docker volumes removed (models, voices, audio, caddy-data, caddy-config, caddy-logs)
            ✓ Docker images removed
            ✓ Fail2ban configs removed (jail.local, caddy-auth.conf)
            ✓ Cron jobs removed (daily-restart, audio-cleanup)
            ✓ ~/comadre directory removed

          The VPS has zero Comadre artifacts remaining.

          To redeploy, run:
            ansible-playbook playbooks/bootstrap.yml -i inventory/production.yml

          ============================================
