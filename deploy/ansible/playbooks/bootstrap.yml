---
# CUMADRE Bootstrap Playbook
# Deploys CUMADRE TTS service on a clean Ubuntu VPS with a single command:
#   ansible-playbook playbooks/bootstrap.yml -i inventory/production.yml
#
# Idempotent: safe to run multiple times. Only tasks with actual changes
# report as "changed".

- name: Bootstrap CUMADRE TTS Service
  hosts: cumadre_vps
  gather_facts: true

  tasks:
    # =========================================================================
    # Prerequisites
    # =========================================================================

    - name: "[Prereq] Verify target is Ubuntu/Debian"
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: >-
          Unsupported OS family '{{ ansible_os_family }}'.
          CUMADRE requires Ubuntu or Debian.
          Install on a supported distribution and retry.
        success_msg: >-
          OS family {{ ansible_os_family }}
          ({{ ansible_distribution }} {{ ansible_distribution_version }})
          is supported.

    - name: "[Prereq] Verify SSH connectivity"
      ansible.builtin.ping:

    - name: "[Prereq] Validate API key is configured"
      ansible.builtin.assert:
        that:
          - api_key_value | length > 0
        fail_msg: >-
          CUMADRE_API_KEY environment variable is not set or is empty.
          Set it before running the playbook: export CUMADRE_API_KEY="your-secret-key"
        success_msg: "API key is configured."

    - name: "[Prereq] Validate repository URL is configured"
      ansible.builtin.assert:
        that:
          - repo_url != 'CHANGE_ME'
        fail_msg: >-
          Repository URL is not configured.
          Set repo_url in inventory/production.yml to your Git repository URL.
        success_msg: "Repository URL is configured: {{ repo_url }}"

    # =========================================================================
    # Docker Installation
    # =========================================================================

    - name: "[Docker] Install prerequisite packages"
      become: true
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: "[Docker] Create keyrings directory"
      become: true
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: "[Docker] Download Docker GPG key"
      become: true
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: "[Docker] Add Docker apt repository"
      become: true
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: "[Docker] Install Docker Engine"
      become: true
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: "[Docker] Add user to docker group"
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      register: docker_group_result

    - name: "[Docker] Reset SSH connection for group changes"  # noqa: no-handler
      when: docker_group_result.changed
      ansible.builtin.meta:
        reset_connection

    # =========================================================================
    # Git Clone
    # =========================================================================

    - name: "[Git] Clone CUMADRE repository"
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "~/cumadre"
        version: "{{ repo_branch }}"
        force: false
        update: true

    # =========================================================================
    # Assets Deployment
    # =========================================================================

    - name: "[Assets] Deploy clone reference WAV to voices volume"
      when: clone_reference_wav | length > 0
      block:
        - name: "[Assets] Stage clone WAV on VPS"
          ansible.builtin.copy:
            src: "{{ clone_reference_wav }}"
            dest: "~/cumadre/deploy/staging/{{ clone_reference_wav | basename }}"
            mode: "0644"

        - name: "[Assets] Create helper container for volume access"
          community.docker.docker_container:
            name: cumadre-volume-helper
            image: alpine:3.21
            volumes:
              - "cumadre-voices:/voices"
            state: present
            auto_remove: false

        - name: "[Assets] Copy clone WAV into voices volume"
          community.docker.docker_container_copy_into:
            container: cumadre-volume-helper
            path: "{{ ansible_env.HOME }}/cumadre/deploy/staging/{{ clone_reference_wav | basename }}"
            container_path: "/voices/{{ clone_reference_wav | basename }}"
            owner_id: 0
            group_id: 0
            mode: "0644"

        - name: "[Assets] Remove helper container"
          community.docker.docker_container:
            name: cumadre-volume-helper
            state: absent

        - name: "[Assets] Clean up staging directory"
          ansible.builtin.file:
            path: "~/cumadre/deploy/staging"
            state: absent

    # =========================================================================
    # Configuration
    # =========================================================================

    - name: "[Config] Create .env file"
      ansible.builtin.copy:
        dest: "~/cumadre/.env"
        content: |
          API_KEY={{ api_key_value }}
          DEFAULT_VOICE=santa
          PORT={{ port }}
        mode: "0600"

    # =========================================================================
    # TTS Service Build & Start
    # =========================================================================

    - name: "[TTS] Build image and start service"
      community.docker.docker_compose_v2:
        project_src: "~/cumadre"
        state: present
        build: always
        remove_orphans: true

    # =========================================================================
    # Cron Jobs
    # =========================================================================

    - name: "[Cron] Configure daily restart"
      ansible.builtin.cron:
        name: "cumadre-daily-restart"
        minute: "0"
        hour: "{{ restart_hour }}"
        job: "cd ~/cumadre && docker compose restart"

    - name: "[Cron] Configure audio cleanup every 6 hours"
      ansible.builtin.cron:
        name: "cumadre-audio-cleanup"
        minute: "0"
        hour: "*/6"
        job: >-
          docker inspect --format '{{ "{{" }}.State.Running{{ "}}" }}'
          tts-service 2>/dev/null | grep -q true &&
          docker exec tts-service find /audio -type f
          \( -name '*.ogg' -o -name '*.wav' \)
          -mmin +1440 -delete

    # =========================================================================
    # Health Check
    # =========================================================================

    - name: "[Health] Wait for service to become healthy"
      ansible.builtin.uri:
        url: "http://localhost:{{ port }}/health"
        return_content: true
      register: health_check
      until: >-
        health_check.status == 200
        and (health_check.json.status | default('')) == "healthy"
      retries: 60
      delay: 10

    # =========================================================================
    # Summary
    # =========================================================================

    - name: "[Summary] Report deployment status"
      vars:
        hc: "{{ health_check.json }}"
      ansible.builtin.debug:
        msg: |
          ============================================
          CUMADRE TTS Service — Bootstrap Complete
          ============================================

          Service Status:  {{ hc.status }}
          Loaded Voices:   {{ hc.voices | join(', ') }}
          Kokoro Engine:   {{ hc.engines.kokoro | default('unknown') }}
          Qwen3 Engine:    {{ hc.engines.qwen3 | default('unknown') }}
          Clone Config:    {{ 'Yes' if hc.clone_configured | default(false) else 'No' }}
          Endpoint URL:    http://{{ ansible_host }}:{{ port }}
          Uptime:          {{ hc.uptime_seconds | default('N/A') }}s

          Test command (copy-paste ready):
          curl -X POST \
            -H "Authorization: Bearer $CUMADRE_API_KEY" \
            -H "Content-Type: application/json" \
            http://{{ ansible_host }}:{{ port }}/v1/audio/speech \
            -d '{"input":"Olá mundo","voice":"santa"}' \
            --output test.ogg

          ============================================
