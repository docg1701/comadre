services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/landing:/srv/www:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    depends_on:
      tts-service:
        condition: service_healthy

  tts-service:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    expose:
      - "8000"
    volumes:
      - comadre-models:/models:rw
      - comadre-voices:/voices:rw
      - comadre-audio:/audio:rw
      - comadre-registry:/var/lib/comadre:rw
    environment:
      KEY_REGISTRY_ENCRYPTION_KEY: ${KEY_REGISTRY_ENCRYPTION_KEY:?KEY_REGISTRY_ENCRYPTION_KEY must be set}
      KEY_REGISTRY_DB_PATH: "${KEY_REGISTRY_DB_PATH:-/var/lib/comadre/registry.db}"
      BILLING_TIMEZONE: "${BILLING_TIMEZONE:-UTC}"
      OPERATOR_CONTACT_HINT: "${OPERATOR_CONTACT_HINT:-}"
      DEFAULT_VOICE: "${DEFAULT_VOICE:-pocket/rafael}"
      PORT: "8000"
      NOISE_DIR: /app/noise
      VOICES_DIR: /voices
      # pocket-tts single engine (v3). The language selects the baked
      # config + the /models/pocket-tts/<lang>/ artifact subtree.
      POCKET_LANGUAGE: "${POCKET_LANGUAGE:-portuguese}"
      POCKET_CONFIG_PATH: /app/models/pocket-tts-config/${POCKET_LANGUAGE:-portuguese}.yaml
      POCKET_MODEL_PATH: /models/pocket-tts/${POCKET_LANGUAGE:-portuguese}/model.safetensors
      POCKET_TOKENIZER_PATH: /models/pocket-tts/${POCKET_LANGUAGE:-portuguese}/tokenizer.model
      POCKET_DEFAULT_VOICE_PATH: /models/pocket-tts/${POCKET_LANGUAGE:-portuguese}/embeddings/rafael.safetensors
      POCKET_THREADS: "${POCKET_THREADS:-4}"
      POCKET_QUANTIZE: "${POCKET_QUANTIZE:-false}"
      POCKET_TEMPERATURE: "${POCKET_TEMPERATURE:-0.7}"
      POCKET_SIGLA_SPACING: "${POCKET_SIGLA_SPACING:-true}"
      # Voice cloning quotas (v3)
      VOICE_UPLOAD_MAX_MB: "${VOICE_UPLOAD_MAX_MB:-10}"
      VOICE_REF_MIN_SECONDS: "${VOICE_REF_MIN_SECONDS:-3}"
      VOICE_REF_MAX_SECONDS: "${VOICE_REF_MAX_SECONDS:-30}"
      VOICE_EPHEMERAL_IDLE_TTL_SECONDS: "${VOICE_EPHEMERAL_IDLE_TTL_SECONDS:-3600}"
      VOICE_EPHEMERAL_ABSOLUTE_TTL_SECONDS: "${VOICE_EPHEMERAL_ABSOLUTE_TTL_SECONDS:-86400}"
      VOICE_EPHEMERAL_MAX_PER_KEY: "${VOICE_EPHEMERAL_MAX_PER_KEY:-5}"
      VOICE_EPHEMERAL_GLOBAL_MAX: "${VOICE_EPHEMERAL_GLOBAL_MAX:-50}"
      VOICE_STORED_MAX_PER_CUSTOMER: "${VOICE_STORED_MAX_PER_CUSTOMER:-20}"
      # Model download: HF_TOKEN once for first boot (gated weights),
      # then set HF_HUB_OFFLINE=1 for a fully offline runtime.
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "4"
          memory: 4G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

volumes:
  comadre-models:
    name: comadre-models
  comadre-voices:
    name: comadre-voices
  comadre-audio:
    name: comadre-audio
  comadre-registry:
    name: comadre-registry
  caddy-data:
    name: caddy-data
  caddy-config:
    name: caddy-config
