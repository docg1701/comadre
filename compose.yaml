services:
  tts-service:
    build: .
    container_name: tts-service
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - comadre-models:/models:rw
      - comadre-voices:/voices:ro
      - comadre-audio:/audio:rw
    environment:
      API_KEY: ${API_KEY:?API_KEY must be set}
      DEFAULT_VOICE: santa
      PORT: "${PORT:-8000}"
      ESPEAK_DATA_PATH: /usr/local/share/espeak-ng-data
      NOISE_DIR: /app/noise
      KOKORO_MODEL_PATH: /models/kokoro-v1.0.onnx
      KOKORO_VOICES_PATH: /models/voices-v1.0.bin
      QWEN3_MODEL_PATH: /models/qwen3-tts-0.6b-q8_0.gguf
      QWEN3_TOKENIZER_PATH: /models/qwen3-tts-tokenizer-f16.gguf
      QWEN3_CLI_PATH: /usr/local/bin/qwen3-tts-cli
      QWEN3_THREADS: "4"
      QWEN3_FEMALE_REFERENCE_PATH: /voices/female-reference.wav
      QWEN3_MALE_REFERENCE_PATH: /voices/male-reference.wav
      # CLONE_REFERENCE_PATH: /voices/audio-referencia-01.wav  # uncomment when clone WAV is placed in voices volume
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  comadre-models:
    name: comadre-models
  comadre-voices:
    name: comadre-voices
  comadre-audio:
    name: comadre-audio
